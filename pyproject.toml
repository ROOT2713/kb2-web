[project]
name = "kb-web"
version = "2.0.0"
description = "知识库 Web 服务 — Hindsight + LLM 驱动的智能文档检索与问答"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jieba>=0.42",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "structlog>=24.0",
    "PyJWT>=2.10",
    "bcrypt>=5.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
